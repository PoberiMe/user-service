version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: user_service_db
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - user-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: user_service_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - user-net

networks:
  user-net:

volumes:
  postgres_data: